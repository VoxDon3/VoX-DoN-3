<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>VoX DoN 3 Host — SlopKit</title>
  <link rel="stylesheet" href="main.css?v=slop1">
</head>
<body class="slop-page">

  <!-- Background = your clean image (no green text) -->
  <div class="slop-bg"></div>

  <!-- Green log ONLY — scrolls over empty black panel -->
  <div class="slop-overlay">
    <pre id="log" class="slop-log"></pre>
  </div>

  <script>
    (function () {
      /* Real SlopKit after animation */
      var TARGET =
        "slopkit/poops.html?go=1&auto=1&production=1&trigger=netcontrol&attempts=8" +
        "&only=ps0_preflight,ps1_prepare,ps3_stage0,ps4_validate,ps5_stage1,ps6_stage2,ps8_stage3,ps9_stage4,ps10_stage5" +
        "&log=debug&payload=1&v=final";

      var lines = [
        "01060  [PREFLIGHT] ATTEMPT 8...",
        "02064  [PREFLIGHT] ATTEMPT 8...",
        "01071  [PREFLIGHT] ATTEMPT 8...",
        "01089  [PS0_PREFLIGHT] OK",
        "01003  [PS0_PREFLIGHT] OK",
        "01088  [PS1_PREPARE] INITIALIZING",
        "02003  [PS1_PREPARE] SUCCESS",
        "02007  [PS3_STAGE0] INIT KERNEL RW",
        "02016  [PS4_VALIDATE] CHECKING POINTERS",
        "02011  [PS4_VALIDATE] CHECKING POINTERS",
        "02018  [PS4_VALIDATE] WEB ACCESS VALIDATED",
        "02012  [PS5_STAGE1] WEB ACCESS VALIDATED",
        "02014  [PS5_STAGE1] WEB ACCESS VALIDATED",
        "02016  [PS5_STAGE1] PAYLOAD FOUND",
        "02031  [v=final] STAGING PAYLOAD...",
        "02030  [v=final] STAGING PAYLOAD...",
        "02037  [v=5_STAGE1] STAGING PAYLOAD...",
        "02036  [v=5_STAGE1] STAGING PAYLOAD...",
        "02038  [v=5_STAGE1] STAGING PAYLOAD...",
        "02040  [CHAIN] HAND OFF TO SLOPKIT..."
      ];

      var el = document.getElementById("log");
      var i = 0;

      function tick() {
        if (i < lines.length) {
          el.textContent += lines[i] + "\n";
          el.scrollTop = el.scrollHeight;
          i++;
          setTimeout(tick, 95 + Math.floor(Math.random() * 70));
        } else {
          setTimeout(function () {
            window.location.href = TARGET;
          }, 600);
        }
      }
      tick();
    })();
  </script>
</body>
</html>
