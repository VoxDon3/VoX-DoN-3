<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<body class="progress-page">

    <h1 class="neon-title">VoX DoN 3 Host</h1>
    <p class="neon-sub">PS5 VoxDon3 Jailbreak (9.00–12.00) — IN PROGRESS...</p>
    <div class="neon-panel">
      <div class="neon-ps5" aria-hidden="true"></div>
      <pre id="neon-log" class="neon-log"></pre>
      <div class="neon-side" id="neon-side"></div>
    </div>
    <p class="neon-hint" id="neon-hint">Loading SlopKit chain…</p>
  </div>
  <script>
    (function () {
      var TARGET =
        "slopkit/poops.html?go=1&auto=1&production=1&trigger=netcontrol&attempts=8" +
        "&only=ps0_preflight,ps1_prepare,ps3_stage0,ps4_validate,ps5_stage1,ps6_stage2,ps8_stage3,ps9_stage4,ps10_stage5" +
        "&log=debug&payload=1&v=final";
      var lines = [
        "01060  [PREFLIGHT] ATTEMPT 8...",
        "02064  [PREFLIGHT] ATTEMPT 8...",
        "01071  [PREFLIGHT] ATTEMPT 8...",
        "01089  [PS0_PREFLIGHT] OK",
        "01003  [PS0_PREFLIGHT] OK",
        "01088  [PS1_PREPARE] INITIALIZING",
        "02003  [PS1_PREPARE] SUCCESS",
        "02007  [PS3_STAGE0] INIT KERNEL RW",
        "02016  [PS4_VALIDATE] CHECKING POINTERS",
        "02018  [PS4_VALIDATE] WEB ACCESS VALIDATED",
        "02012  [PS5_STAGE1] WEB ACCESS VALIDATED",
        "02016  [PS5_STAGE1] PAYLOAD FOUND",
        "02031  [v=final] STAGING PAYLOAD...",
        "02037  [v=5_STAGE1] STAGING PAYLOAD...",
        "02040  [CHAIN] HAND OFF TO SLOPKIT..."
      ];
      var side = ["0x80000 offset0","0x80000 offset1","0x80000 offset2","0x80000 offset3","0x80000 offset4"];
      var logEl = document.getElementById("neon-log");
      var sideEl = document.getElementById("neon-side");
      var hint = document.getElementById("neon-hint");
      var i = 0;
      function tick() {
        if (i < lines.length) {
          logEl.textContent += lines[i] + "\n";
          if (i < side.length) sideEl.textContent += side[i] + "\n";
          logEl.scrollTop = logEl.scrollHeight;
          i++;
          setTimeout(tick, 110 + Math.floor(Math.random() * 70));
        } else {
          if (hint) hint.textContent = "Starting real SlopKit exploit…";
          setTimeout(function () { window.location.href = TARGET; }, 450);
        }
      }
      tick();
    })();
  </script>
